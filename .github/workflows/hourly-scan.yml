name: Daily ASX signal watchlist

on:
  workflow_dispatch:
  schedule:
    # 08:00 UTC is 18:00 AEST / 19:00 AEDT, safely after the ASX close.
    - cron: "0 8 * * 1-5"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Build daily signal watchlist
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python -m asx_paper_trader.cli watchlist --config config.json
      - uses: actions/upload-artifact@v4
        with:
          name: daily-watchlist-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 90
