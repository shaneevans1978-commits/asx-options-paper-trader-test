[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asx-options-paper-trader"
version = "0.1.0"
description = "Defined-risk ASX options paper-trading scanner"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
asx-paper-trader = "asx_paper_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
